<html>
  <head>
    <title>Plotly demo</title>
        <style>
      body{
        background-color:#8611cf;
      }
    </style>
    <script src="https://cdn.plot.ly/plotly-3.6.0.min.js" charset="utf-8"></script>
  </head>
  <body>
    <center>
    <h1>My first plotly chart</h1>
    <div id="plot"></div>
    <p><a href="index.html">Return to the homepage</a></p>
    <hr>
    <p> &copy; STEM prep 2026</p>
    </center>
    <script>
      var trace={
        x: [1,2,3,4,5],
        y: [6,30,400,80,4],
        mode: "lines"
      };
      var data=[trace];
      var layout={title: "my first plotly"};
      Plotly.newPlot("plot",data,layout);
    </script>
  </body>
</html>
